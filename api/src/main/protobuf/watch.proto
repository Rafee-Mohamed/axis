syntax = "proto3";
package axis.api;
option java_package = "io.disys.axis.api.proto";
option java_multiple_files = true;
option java_outer_classname = "WatchProto";

import "types.proto";

service WatchService {
    // Single bidirectional stream multiplexes all watches for a connection.
    // Client sends create/cancel/progress requests; server sends events and confirmations.
    rpc Watch(stream WatchClientMessage) returns (stream WatchServerMessage);
}

// ===================== Client -> Server =====================

message WatchClientMessage {
    oneof request {
        WatchKeyRequest      watch_key   = 1;
        WatchRangeRequest    watch_range = 2;
        WatchCancelRequest   cancel      = 3;
        WatchProgressRequest progress    = 4;
    }
}

// Watch a single key.
// start_revision = 0 means watch from now. A past revision replays
// all events from that revision before streaming live events.
// If start_revision is before the compaction point the server cancels
// with reason COMPACTED.
message WatchKeyRequest {
    bytes                key            = 1;
    int64                start_revision = 2;
    bool                 prev_kv        = 3;
    repeated WatchFilter filters        = 4;
}

// Watch a key range [from, to).
// start_revision = 0 means watch from now. A past revision replays
// all events from that revision before streaming live events.
// If start_revision is before the compaction point the server cancels
// with reason COMPACTED.
message WatchRangeRequest {
    bytes                from           = 1;
    bytes                to             = 2;
    int64                start_revision = 3;
    bool                 prev_kv        = 4;
    repeated WatchFilter filters        = 5;
}

// Suppress event types the client does not need.
enum WatchFilter {
    NO_PUT    = 0;
    NO_DELETE = 1;
}

message WatchCancelRequest   { int64 watch_id = 1; }
message WatchProgressRequest {}

// ===================== Server -> Client =====================

message WatchServerMessage {
    oneof message {
        WatchCreated  created  = 1;
        WatchCancelled cancelled = 2;
        WatchEvents   events   = 3;
        WatchProgress progress = 4;
    }
}

// Confirms a watch was created. revision is the revision at which
// the watch starts - events at or after this revision will be delivered.
message WatchCreated {
    int64 watch_id = 1;
    int64 revision = 2;
}

// Sent when a watch ends - either client-initiated or server-initiated.
// compacted_revision is set only when reason = COMPACTED, indicating
// the earliest revision still available.
message WatchCancelled {
    int64        watch_id           = 1;
    CancelReason reason             = 2;
    int64        compacted_revision = 3;
}

enum CancelReason {
    CLIENT_CANCELLED = 0;
    COMPACTED        = 1;
}

// One or more events for a specific watch. During catch-up from a past
// revision, multiple events may be batched together.
message WatchEvents {
    int64               watch_id = 1;
    repeated WatchEvent events   = 2;
}

// Server sends this in response to WatchProgressRequest.
// Guarantees no events have been missed on this stream up to revision.
message WatchProgress {
    int64 revision = 1;
}

// ===================== Event =====================

message WatchEvent {
    EventType type    = 1;
    KeyVal    kv      = 2;
    KeyVal    prev_kv = 3; // only populated if watch was created with prev_kv = true
}

enum EventType {
    PUT    = 0;
    DELETE = 1;
}
